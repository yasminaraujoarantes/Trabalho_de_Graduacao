plugins {
	id 'org.springframework.boot' version '2.4.0-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.0.10.RELEASE'
	id 'java'
}

group = 'com.tg'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.8'

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
  	developmentOnly 'org.springframework.boot:spring-boot-devtools'
  	testImplementation 'org.springframework.boot:spring-boot-starter-test'
  	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  	testImplementation('org.springframework.boot:spring-boot-starter-test') {
    	exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
  	}
	compile group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '3.141.59'
	compile group: 'org.seleniumhq.selenium', name: 'selenium-support', version: '3.141.59'
	compile group: 'org.seleniumhq.selenium', name: 'selenium-chrome-driver', version: '3.141.59'
	compile group: 'commons-io', name: 'commons-io', version: '2.6'
	compile group: 'org.hibernate', name: 'hibernate-search-orm', version: '5.11.5.Final'
	compile 'mysql:mysql-connector-java:8.0.21'
	compile group: 'org.postgresql', name: 'postgresql', version: '42.2.18'
	
}

test {
	useJUnitPlatform()
}

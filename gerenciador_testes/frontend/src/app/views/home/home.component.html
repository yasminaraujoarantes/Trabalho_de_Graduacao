<h1>Gerenciador de Casos de Teste</h1>

<div class="ui-g-12" style="margin-bottom:10px;">
    <button pButton type="button"  icon="pi pi-plus" iconPos="left" label="Novo caso de teste" style="float: right;" [routerLink]="['/novo']"></button>
</div>
<div class="ui-g-12">
    <p-table [value]="casosDeTesteCasoDeTeste">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Objetivo</th>
                <th colspan="2">Ações </th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{item.id}}</td>
                <td>{{item.nome}}</td>
                <td>{{item.objetivo}}</td>
                <td style="text-align: center;" colspan="2">
                    <button pButton type="button" icon="pi pi-search" iconPos="left" label="Visualizar" [routerLink]="['/visualizar', item.id]"></button>
		            <button pButton type="button" icon="pi pi-copy" iconPos="left" label="Clonar"class="ui-button-warning" style="margin-left: 10px;" (click)="clonarCasoDeTeste(item.id)"></button>
                    <button pButton type="button" icon="pi pi-trash" iconPos="left" label="Excluir" class="ui-button-danger" style="margin-left: 10px;" (click)="deletarCasoDeTeste(item.id)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
